[workspace]
members = [
    "crates/sqltide-sqltext",
    "crates/sqltide-json",
    "crates/sqltide-compile",
    "crates/sqltide-sqlanalysis",
    "crates/sqltide-planner",
    "crates/sqltide-executor",
    "crates/sqltide-clickhouse",
    "crates/sqltide-discovery",
    "crates/sqltide-config",
    "crates/sqltide-rules",
    "crates/sqltide-cli",
    "crates/sqltide-python",
]
resolver = "2"

[workspace.package]
version = "0.67.2"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.88"

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
flate2 = "1"
getrandom = "0.3"
md-5 = "0.10"
fensu-policy = "=0.22.0"
# Published SQLClean 0.4.2; its Polyglot revision matches the compiler below.
sqlclean = { git = "https://github.com/sqlstack-io/sqlclean.git", rev = "571e40a746b3d8d20d6118620f05428eca45243c" }
# The SQL engine, pinned to the revision SQLBuild uses so both products parse ClickHouse alike.
polyglot-sql = { git = "https://github.com/sqlstack-io/polyglot.git", rev = "8767d688c5b504ad609645e27ab77a260d91c5a1", default-features = false, features = [
    "dialect-clickhouse",
    "generate",
    "semantic",
    "stacker",
] }
pyo3 = { version = "0.26", features = ["abi3-py312"] }
regex = "1.13"
saphyr-parser = "0.1"
serde = "1"
sha2 = "0.10"
serde_json = "1"
serde_path_to_error = "0.1.20"
speedate = "0.18.0"
strum = "0.28.0"
sqltide-cli = { path = "crates/sqltide-cli" }
sqltide-clickhouse = { path = "crates/sqltide-clickhouse" }
sqltide-compile = { path = "crates/sqltide-compile" }
sqltide-config = { path = "crates/sqltide-config" }
sqltide-discovery = { path = "crates/sqltide-discovery" }
sqltide-executor = { path = "crates/sqltide-executor" }
sqltide-json = { path = "crates/sqltide-json" }
sqltide-planner = { path = "crates/sqltide-planner" }
sqltide-rules = { path = "crates/sqltide-rules" }
sqltide-sqlanalysis = { path = "crates/sqltide-sqlanalysis" }
sqltide-sqltext = { path = "crates/sqltide-sqltext" }
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
toml_parser = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
strip = "symbols"
