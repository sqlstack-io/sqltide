name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify verification scope
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.scope.outputs.integration }}
      e2e: ${{ steps.scope.outputs.e2e }}
      browser: ${{ steps.scope.outputs.browser }}
      packaging: ${{ steps.scope.outputs.packaging }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select relevant suites
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          write_scope() {
            {
              echo "integration=$1"
              echo "e2e=$2"
              echo "browser=$3"
              echo "packaging=$4"
            } >> "${GITHUB_OUTPUT}"
          }

          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            write_scope true true true true
            exit 0
          fi

          focused=true
          packaging=false
          browser=false
          changed=false
          while IFS= read -r -d '' path; do
            changed=true
            case "${path}" in
              Cargo.*|crates/*|pyproject.toml|src/sqltide/_native.pyi|.github/workflows/build-distributions.yml|.github/workflows/publish.yml)
                packaging=true
                ;;
            esac
            case "${path}" in
              ui/*)
                browser=true
                ;;
              .github/workflows/website.yml|.github/workflows/verify.yml)
                focused=false
                ;;
              tests/unit/*)
                ;;
              .github/*|docs/*|*.md|LICENSE)
                ;;
              *)
                focused=false
                ;;
            esac
          done < <(git diff --name-only -z "${BASE_SHA}" "${HEAD_SHA}")

          if [[ "${changed}" != "true" || "${focused}" != "true" ]]; then
            write_scope true true true "${packaging}"
            exit 0
          fi

          write_scope false false "${browser}" "${packaging}"

  checks:
    name: Static, UI, and unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Python
        run: uv python install "$(cat .python-version)"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Build UI assets
        run: make ui-install ui-build
      - name: Run static and UI checks
        run: make check-ci ui-verify
      - name: Run unit tests
        run: make test

  integration:
    name: ClickHouse integration tests
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Python
        run: uv python install "$(cat .python-version)"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run integration tests
        run: make test-integration

  e2e:
    name: Process and executor E2E tests
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Python
        run: uv python install "$(cat .python-version)"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Build packaged UI
        run: make ui-install ui-build
      - name: Run non-browser E2E tests
        run: make test-e2e

  browser:
    name: Packaged Chromium E2E tests
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Python
        run: uv python install "$(cat .python-version)"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Verify Docker
        run: docker info
      - name: Build packaged UI
        run: make ui-install ui-build
      - name: Run browser E2E tests
        run: make test-browser
      - name: Capture container diagnostics
        if: always()
        run: |
          mkdir -p test-results/ci
          docker info > test-results/ci/docker-info.txt 2>&1 || true
          docker ps -a > test-results/ci/docker-containers.txt 2>&1 || true
          docker network ls > test-results/ci/docker-networks.txt 2>&1 || true
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-artifacts
          path: test-results/
          if-no-files-found: error
          retention-days: 7

  distributions:
    name: Distributions
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    uses: ./.github/workflows/build-distributions.yml

  website:
    name: Website
    uses: ./.github/workflows/website.yml

  verify:
    name: Verify
    if: always()
    needs: [changes, checks, integration, e2e, browser, distributions, website]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all required verification jobs passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          DISTRIBUTIONS_RESULT: ${{ needs.distributions.result }}
          WEBSITE_RESULT: ${{ needs.website.result }}
        run: |
          if [[ "${CHANGES_RESULT}" != "success" || "${CHECKS_RESULT}" != "success" || "${WEBSITE_RESULT}" != "success" ]]; then
            echo "Required classification, static or website checks did not pass" >&2
            exit 1
          fi
          for result in "${INTEGRATION_RESULT}" "${E2E_RESULT}" "${BROWSER_RESULT}" \
            "${DISTRIBUTIONS_RESULT}"; do
            if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
              echo "A selected verification suite did not pass: ${result}" >&2
              exit 1
            fi
          done
          echo "All path-relevant verification jobs passed"
