[build-system]
requires = [
  "maturin>=1.9,<2",
  "patchelf>=0.17.2; sys_platform == 'linux'",
]
build-backend = "maturin"

[project]
name = "sqltide"
version = "0.46.0"
description = "Declarative SQL streaming pipelines for ClickHouse"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1",
  "clickhouse-connect>=0.8.18",
  "PyYAML>=6.0.2",
  "fastapi>=0.115",
  "kafka-python-ng>=2.2.3",
  "psycopg[binary]>=3.2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.43",
  "uvicorn>=0.30",
]

[project.urls]
Documentation = "https://docs.streambuild.dev"
Issues = "https://github.com/sqlstack-io/sqltide/issues"
Repository = "https://github.com/sqlstack-io/sqltide"

[project.scripts]
sqt = "sqltide.cli.entry.main.main:main"

[dependency-groups]
dev = [
  "commitizen>=4.9.1",
  "fensu>=0.10.0",
  "httpx>=0.27",
  "packaging>=24.0",
  "pre-commit>=4.3.0",
  "psycopg[binary]>=3.2.9",
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0",
  "pytest-playwright>=0.7.0",
  "pytest-xdist>=3.6",
  "ruff>=0.12.0",
  "sqlfluff>=3.4.2",
  "testcontainers>=4.13.0",
  "ty>=0.0.1a19",
]

[tool.maturin]
manifest-path = "crates/sqltide-python/Cargo.toml"
module-name = "sqltide._native"
python-source = "src"
features = ["extension-module"]
# Built dev UI is gitignored but must ship in distributions (`make dist`).
include = [{ path = "src/sqltide/dev_server/static/**/*", format = ["sdist", "wheel"] }]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "semver2"
update_changelog_on_bump = false

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["*.egg", ".*", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}"]
markers = [
  "integration: marks tests that require real external services",
  "e2e: marks tests that exercise full end-to-end workflows",
  "browser: marks tests that require Chromium and the packaged development UI",
  "performance: marks opt-in comparative performance guards",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.uv]
package = true
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "crates/*/Cargo.toml" },
  { file = "crates/*/src/**/*.rs" },
  { file = "src/sqltide/_native.pyi" },
]
required-version = ">=0.12.3,<0.13"
