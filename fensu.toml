[targets.python]
analyzer = "python"
root = "."
roots = ["src/sqltide"]
tests = ["tests"]
tooling = ["scripts"]
rule_modules = [
  "scripts.fensu_policy.classes.workflow_authority_policy",
  "scripts.fensu_policy.rules.adapter_ownership",
  "scripts.fensu_policy.rules.event_catalog_authority",
  "scripts.fensu_policy.rules.observability_authority",
  "scripts.fensu_policy.rules.sql_analysis_boundary",
  "scripts.fensu_policy.rules.workflow_authority",
]
select = ["FF", "XSQT"]

[targets.python.cache]
enabled = true
require_cacheable = true

[targets.python.evaluation]
exclude = ["tests/e2e/fixtures/**", "src/sqltide/playground_templates/**"]

[[targets.python.rule_exceptions]]
rule = "FFR402"
path = "src/sqltide/sensors/__init__.py"
reason = "Authored project sensors import the public sensor API from sqltide.sensors, so this package initializer re-exports the closed authored surface exactly as the documented sensor API defines it."

[[targets.python.rule_exceptions]]
rule = "FFR402"
path = "src/sqltide/events/__init__.py"
reason = "Authored project sensors import derived event types from sqltide.events, so this package initializer re-exports the closed authored surface exactly as the documented sensor API defines it."

[[targets.python.rule_exceptions]]
rule = "FFS120"
path = "src/sqltide/sensors/classes/event_sensor_context.py"
symbols = ["EventSensorContext.step"]
reason = "The authored durable-step API is ctx.step(key, fn, policy=...) with positional key and callable per the documented sensor API; keyword-only parameters would break the documented authored ergonomics."

[[targets.python.rule_exceptions]]
rule = "FFT104"
path = "tests/e2e/src/sqltide/dev_server/helpers.py"
symbols = ["wait_for_sensor_first_dispatch", "wait_for_sensor_dead_letter"]
reason = "These wait_for_* helpers poll the dev server until sensor dispatch state is reached asynchronously. A bounded retry loop and its readiness condition are the wait itself, so they cannot be expressed branch-free."

[[targets.python.rule_exceptions]]
rule = "FFT104"
path = "tests/e2e/src/sqltide/executor/helpers.py"
symbols = ["wait_for_query_view_activity", "wait_for_row_count", "wait_for_state_model_activity", "wait_for_table_exists", "wait_for_table_missing"]
reason = "These wait_for_* helpers poll for state reached asynchronously. A bounded retry loop and its early return are the wait condition, so they cannot be expressed branch-free. Every other conditional in this module has been removed."

[[targets.python.rule_exceptions]]
rule = "FFR309"
path = "src/sqltide/dev_server/__init__.py"
reason = "Native bindings own the dev server: HTTP serving, routes, authorization, payloads, warehouse reads, compile state, readers, manual checks, deployment operations, the build child process and the audit and sensor schedulers; this package declares the request and response models, types, constants and errors they build and raise, plus the kafka-python-ng client glue."

[[targets.python.rule_exceptions]]
rule = "FFR309"
path = "src/sqltide/cli/dev/__init__.py"
reason = "Native bindings own the dev command handler, its startup banner and its activity lines; this package only declares the command option shape the CLI dispatcher builds."

[[targets.python.rule_exceptions]]
rule = "FFR309"
path = "src/sqltide/cli/entry/__init__.py"
reason = "Native bindings own the sqt entry point: argument parsing, invocation and connection resolution, mode validation, command dispatch and error rendering; this package only declares the handler table, command types, constants and the user error they consume and raise."

[[targets.python.rule_exceptions]]
rule = "FFR309"
path = "src/sqltide/cli/admin/__init__.py"
reason = "Native bindings own the sqt admin commands and their password prompts; this package only declares the admin command types and constants they consume."

[[targets.python.rule_exceptions]]
rule = "FFR309"
path = "src/sqltide/sensors/__init__.py"
reason = "Native bindings own sensor loading, dispatch, durable steps and state persistence; this package keeps the public authored sensor API, the contexts handed to user handlers, the shim that runs a user handler, and the sensor shapes."

[[targets.python.rule_exceptions]]
rule = "FFR309"
path = "src/sqltide/events/__init__.py"
