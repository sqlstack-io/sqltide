services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://redpanda.localhost:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      default:
        aliases:
          - redpanda.localhost
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.4
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        partitions=$$(rpk topic list --brokers redpanda:9092 | \
          awk -v topic="$${KAFKA_TOPIC}" '$$1 == topic {print $$2}')
        if [ -z "$${partitions}" ]; then
          rpk topic create "$${KAFKA_TOPIC}" \
            --brokers redpanda:9092 \
            --partitions 3 \
            --topic-config retention.ms=604800000
          partitions=3
        fi
        if [ "$${partitions}" -lt 3 ]; then
          rpk topic add-partitions "$${KAFKA_TOPIC}" \
            --brokers redpanda:9092 \
            --num $$((3 - partitions))
        fi
        rpk topic alter-config "$${KAFKA_TOPIC}" \
          --brokers redpanda:9092 \
          --no-confirm \
          --set retention.ms=604800000
        partitions=$$(rpk topic list --brokers redpanda:9092 | \
          awk -v topic="$${KAFKA_TOPIC}" '$$1 == topic {print $$2}')
        test "$${partitions}" -eq 3
    environment:
      KAFKA_TOPIC: source.order_events.live
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    ports:
      - "127.0.0.1:18125:8123"
    environment:
      CLICKHOUSE_DB: sqltide_streaming
      CLICKHOUSE_USER: playground
      CLICKHOUSE_PASSWORD: sqltide_playground
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "playground", "--password", "sqltide_playground", "--query", "SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_TOPIC: source.order_events.live
      TICK_INTERVAL_SECONDS: ${TICK_INTERVAL_SECONDS:-3}
      NEW_ORDERS_PER_TICK: ${NEW_ORDERS_PER_TICK:-2}
      PRODUCER_RANDOM_SEED: ${PRODUCER_RANDOM_SEED:-86}
      PRODUCER_STATE_PATH: /var/lib/producer/state.json
      FUTURE_EVENT_SECONDS: ${FUTURE_EVENT_SECONDS:-30}
    volumes:
      - producer-state:/var/lib/producer
    depends_on:
      topic-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  redpanda-data:
  clickhouse-data:
  producer-state:
