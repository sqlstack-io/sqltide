[[stays]]
path = "auth/_helpers/password_hashing.py"
rule = 4
note = "Rule 4: glue around argon2-cffi; RustCrypto's argon2 cannot accept every hash libargon2 accepts (its output and salt length limits, a missing version field and other versions differ), so stored hashes would stop verifying. Calls PasswordHasher hash, verify and check_needs_rehash and returns plain values. Password validation and when to hash, verify or store a replacement are native."

[[stays]]
path = "auth/classes/relational_driver.py"
rule = 4
note = "Rule 4: glue around SQLAlchemy/psycopg; connection URL, libpq environment, TLS and service-file handling stay with the driver. Creates the pooled engine from the URL, opens and commits or rolls back one transaction, executes native statement text with bound parameters, returns plain rows and row counts, and classifies driver errors as integrity or other. All SQL and DDL, row mapping, sessions, tokens, auditing and role rules are native."

